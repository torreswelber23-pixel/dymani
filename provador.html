<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d0810">

<!-- =============================================================
     DYMANI — Provador Virtual · ETAPA 1 (reconhecimento do dedo)
     Página de TESTE separada. Abre a câmera e desenha ao vivo os
     pontos da mão (MediaPipe Hand Landmarker, roda no próprio
     celular, de graça), marcando a ZONA DA UNHA de cada dedo.
     Objetivo: ver a precisão do reconhecimento antes de partir
     pra colocar a moldura (etapa 2 / 3D).
     ============================================================= -->

<title>Dymani — Provador (teste de reconhecimento)</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💅</text></svg>">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;overflow:hidden}
  .wrap{position:fixed;inset:0;display:flex;flex-direction:column}
  .stagewrap{position:relative;flex:1;min-height:0;background:#0d0810}
  #canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  video{display:none}

  .hud{position:absolute;top:calc(12px + env(safe-area-inset-top));left:12px;right:12px;z-index:3;
    display:flex;gap:8px;align-items:flex-start;pointer-events:none}
  .status{background:rgba(13,8,16,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    border:1px solid rgba(244,114,182,.3);border-radius:14px;padding:9px 13px;font-size:.82rem;font-weight:600;
    line-height:1.35;max-width:75%}
  .status b{color:#f9d5e6}
  .status .mao{color:#34d399}
  .status .nada{color:#fca5a5}
  .fps{margin-left:auto;background:rgba(13,8,16,.72);border:1px solid rgba(255,255,255,.14);border-radius:12px;
    padding:8px 11px;font-size:.72rem;color:#c4b5d0;font-weight:700}

  .bar{display:flex;align-items:center;justify-content:space-around;padding:14px 0 calc(16px + env(safe-area-inset-bottom));
    background:#0d0810;z-index:3}
  .b{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.14);border:none;color:#fff;
    display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.15rem}
  .b:active{transform:scale(.93)}
  .seg{display:flex;background:rgba(255,255,255,.1);border-radius:22px;padding:4px}
  .seg button{border:none;background:none;color:#c4b5d0;font-weight:700;font-size:.82rem;padding:8px 14px;border-radius:18px;cursor:pointer}
  .seg button.on{background:linear-gradient(90deg,#ec4899,#a855f7);color:#fff}

  .tela{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:30px;background:radial-gradient(700px 400px at 50% 30%,#2a1442,#0d0810)}
  .tela h1{font-size:1.5rem;margin-bottom:8px}
  .tela p{color:#c4b5d0;font-size:.95rem;max-width:340px;margin-bottom:8px;line-height:1.5}
  .tela .lg{font-size:3rem;margin-bottom:10px}
  .tela button{margin-top:18px;padding:15px 26px;border:none;border-radius:30px;font-size:1.05rem;font-weight:800;cursor:pointer;
    color:#2a1608;background:linear-gradient(90deg,#f4d58d,#d9b36a);box-shadow:0 8px 26px rgba(217,179,106,.35)}
  .spin{width:38px;height:38px;border:4px solid rgba(255,255,255,.2);border-top-color:#f472b6;border-radius:50%;
    animation:sp 1s linear infinite;margin:0 auto 14px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .erro{color:#fca5a5;font-size:.85rem;margin-top:12px;max-width:340px}
</style>
</head>
<body>
<div class="wrap">
  <div class="stagewrap">
    <video id="v" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div class="hud">
      <div class="status" id="status">Preparando…</div>
      <div class="fps" id="fps">— fps</div>
    </div>
    <!-- tela inicial / carregando -->
    <div class="tela" id="tela">
      <div class="lg">💅</div>
      <h1>Provador · Etapa 1</h1>
      <p>Vamos ver se o celular reconhece bem o seu dedo. Aponte a câmera pra sua mão e veja os pontos e a <b>zona da unha</b> aparecerem em cima.</p>
      <div id="tela-extra"></div>
      <button id="btn-start">📷 Ligar a câmera</button>
      <div class="erro" id="erro"></div>
    </div>
  </div>
  <div class="bar">
    <button class="b" id="flip">🔄</button>
    <div class="seg" id="seg">
      <button data-mode="unha" class="on">Só a unha</button>
      <button data-mode="mao">Ver a mão</button>
    </div>
    <button class="b" id="close" onclick="location.reload()">✕</button>
  </div>
</div>

<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const $=s=>document.querySelector(s);
const v=$('#v'), cv=$('#canvas'), x=cv.getContext('2d');
let landmarker=null, stream=null, facing='environment', rodando=false, modo='unha';
let suav=null, dedoSel=1; // pontos suavizados e o dedo escolhido (1 = indicador)
let lastT=0, fps=0, fpsSm=0;

// conexões da mão (pares de índices) — MediaPipe Hands
const CONEXOES=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
// por dedo: [ponta, junta antes da unha (DIP/IP), junta de baixo]  -> pra achar a unha e a largura
const DEDOS=[
  {nome:'polegar', tip:4, dip:3, mcp:2},
  {nome:'indicador', tip:8, dip:7, mcp:5},
  {nome:'médio', tip:12, dip:11, mcp:9},
  {nome:'anelar', tip:16, dip:15, mcp:13},
  {nome:'mindinho', tip:20, dip:19, mcp:17}];

async function carregarModelo(){
  const fs=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  landmarker=await HandLandmarker.createFromOptions(fs,{
    baseOptions:{
      modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      delegate:"GPU"
    },
    numHands:1, runningMode:"VIDEO"
  });
}

async function ligarCamera(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:false});
  v.srcObject=stream;
  await v.play();
  await new Promise(r=>{ if(v.videoWidth) r(); else v.onloadedmetadata=()=>r(); });
}

function start(){
  $('#tela-extra').innerHTML='<div class="spin"></div><p>Baixando o reconhecedor (só na 1ª vez)…</p>';
  $('#btn-start').style.display='none'; $('#erro').textContent='';
  Promise.all([carregarModelo(), ligarCamera()]).then(()=>{
    $('#tela').style.display='none';
    rodando=true; requestAnimationFrame(loop);
  }).catch(e=>{
    $('#tela-extra').innerHTML='';
    $('#btn-start').style.display='';
    $('#erro').textContent='Não consegui iniciar: '+(e.message||e)+'. Verifique a permissão da câmera e a internet.';
  });
}

// mapeia ponto normalizado (0-1 no frame do vídeo) -> pixel no canvas (cover + espelho)
let mapCtx={sx:0,sy:0,e:1,W:0,H:0,mirror:false};
function calcCover(){
  const vw=v.videoWidth, vh=v.videoHeight, W=cv.width, H=cv.height;
  const e=Math.max(W/vw, H/vh);
  mapCtx={ e, W, H, vw, vh, dx:(W-vw*e)/2, dy:(H-vh*e)/2, mirror:(facing==='user') };
}
function mapPt(p){
  const m=mapCtx; let px=p.x*m.vw*m.e+m.dx; const py=p.y*m.vh*m.e+m.dy;
  if(m.mirror)px=m.W-px;
  return [px,py];
}

function loop(t){
  if(!rodando)return;
  if(cv.width!==cv.clientWidth*devicePixelRatio||cv.height!==cv.clientHeight*devicePixelRatio){
    cv.width=cv.clientWidth*devicePixelRatio; cv.height=cv.clientHeight*devicePixelRatio;
  }
  calcCover();
  // desenha o vídeo (cover + espelho) no canvas
  x.save();
  if(mapCtx.mirror){x.translate(cv.width,0);x.scale(-1,1);}
  const {e,vw,vh}=mapCtx, W=cv.width,H=cv.height;
  x.drawImage(v,(W-vw*e)/2,(H-vh*e)/2,vw*e,vh*e);
  x.restore();

  let achou=false, nomeDedo='';
  if(landmarker&&v.videoWidth){
    const res=landmarker.detectForVideo(v, t);
    if(res&&res.landmarks&&res.landmarks.length){achou=true; nomeDedo=processarMao(res.landmarks[0]);}
    else suav=null;
  }
  // fps
  if(lastT){const dt=t-lastT; fps=1000/dt; fpsSm=fpsSm?fpsSm*0.9+fps*0.1:fps;}
  lastT=t;
  $('#fps').textContent=Math.round(fpsSm)+' fps';
  $('#status').innerHTML = achou
    ? `<b class="mao">✓ unha do ${nomeDedo}</b><br>contorno acompanhando o dedo`
    : `<b class="nada">Mostre um dedo</b><br>aproxime, com boa luz`;
  requestAnimationFrame(loop);
}

// suaviza os pontos, escolhe o dedo mais apresentado e desenha o contorno da unha
function processarMao(lm){
  if(!suav||suav.length!==lm.length) suav=lm.map(p=>({x:p.x,y:p.y}));
  else for(let i=0;i<lm.length;i++){suav[i].x+=(lm[i].x-suav[i].x)*0.45;suav[i].y+=(lm[i].y-suav[i].y)*0.45;}
  const px=suav.map(mapPt);
  // comprimento aparente da unha de cada dedo (ponta->junta); o maior é o dedo apresentado
  const Ls=DEDOS.map(d=>Math.hypot(px[d.tip][0]-px[d.dip][0],px[d.tip][1]-px[d.dip][1]));
  let melhor=0; Ls.forEach((L,i)=>{if(L>Ls[melhor])melhor=i;});
  if(melhor!==dedoSel && Ls[melhor] > Ls[dedoSel]*1.35) dedoSel=melhor; // histerese (não fica pulando)
  if(modo==='mao') desenharEsqueleto(px);
  const d=DEDOS[dedoSel];
  desenharContornoUnha(px[d.tip],px[d.dip],px[d.mcp],px);
  return d.nome;
}

function desenharEsqueleto(px){
  x.save();
  x.lineWidth=Math.max(1.5,cv.width*0.003); x.strokeStyle='rgba(196,181,208,.5)';
  x.beginPath(); CONEXOES.forEach(([a,b])=>{x.moveTo(px[a][0],px[a][1]);x.lineTo(px[b][0],px[b][1]);}); x.stroke();
  px.forEach(p=>{x.beginPath();x.arc(p[0],p[1],cv.width*0.005,0,7);x.fillStyle='rgba(255,255,255,.6)';x.fill();});
  x.restore();
}

// desenha só a LINHA em volta da unha (formato amêndoa), acompanhando o dedo
function desenharContornoUnha(tip,dip,mcp,px){
  const vx=tip[0]-dip[0], vy=tip[1]-dip[1], L=Math.hypot(vx,vy)||1;
  const ux=vx/L, uy=vy/L, ppx=-uy, ppy=ux;            // u = direção do dedo; pp = perpendicular
  // a unha ocupa o trecho perto da ponta: da cutícula (perto da junta) até a borda livre
  const bx=tip[0]-ux*L*0.86, by=tip[1]-uy*L*0.86;     // cutícula (base)
  const fx=tip[0]-ux*L*0.04, fy=tip[1]-uy*L*0.04;     // borda livre (ponta)
  const cx=(bx+fx)/2, cy=(by+fy)/2, half=Math.hypot(fx-cx,fy-cy);
  const W=half*0.82;                                  // meia-largura (largura ~ 0.9 do comprimento)
  x.save();
  x.beginPath();
  // lado direito: base -> ponta (controles mais perto do centro = pontas arredondadas)
  x.moveTo(bx,by);
  x.bezierCurveTo(bx+ux*half*0.32+ppx*W, by+uy*half*0.32+ppy*W,
                  fx-ux*half*0.32+ppx*W, fy-uy*half*0.32+ppy*W, fx,fy);
  // lado esquerdo: ponta -> base
  x.bezierCurveTo(fx-ux*half*0.32-ppx*W, fy-uy*half*0.32-ppy*W,
                  bx+ux*half*0.32-ppx*W, by+uy*half*0.32-ppy*W, bx,by);
  x.closePath();
  // brilho externo + linha rosa + fio branco por dentro
  x.shadowColor='rgba(236,72,153,.85)'; x.shadowBlur=cv.width*0.02;
  x.lineWidth=Math.max(3,cv.width*0.009); x.strokeStyle='#ff5ea8'; x.lineJoin='round'; x.stroke();
  x.shadowBlur=0;
  x.lineWidth=Math.max(1.4,cv.width*0.0032); x.strokeStyle='rgba(255,255,255,.92)'; x.stroke();
  // marca a cutícula (bolinha) e a direção, ajuda a ver o encaixe
  x.beginPath(); x.arc(bx,by,cv.width*0.006,0,7); x.fillStyle='#fff'; x.fill();
  x.restore();
}

// controles
$('#btn-start').onclick=start;
$('#flip').onclick=async()=>{ facing=facing==='environment'?'user':'environment'; try{await ligarCamera();}catch(e){} };
$('#seg').querySelectorAll('button').forEach(btn=>btn.onclick=()=>{
  modo=btn.dataset.mode;
  $('#seg').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===btn));
});
// se não houver suporte a câmera
if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){
  $('#tela-extra').innerHTML=''; $('#btn-start').style.display='none';
  $('#erro').textContent='Este navegador não tem acesso à câmera.';
}
window._diag=()=>({landmarker:!!landmarker,rodando,facing,fps:Math.round(fpsSm)});
</script>
</body>
</html>
