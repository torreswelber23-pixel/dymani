<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#140717">

<!-- =============================================================
     MAPA MULHER — Marketplace de manicures (vitrine agregada)
     Lista TODOS os studios do banco (cu_studios_listar).
     mapa.html?carro=ID_DO_MOTORISTA  → atribui a indicação do carro
     Clica num salão → portfolio.html?s=slug&carro=ID (agendamento)
     ============================================================= -->

<title>Mapa Mulher — Manicures perto de você</title>
<meta name="description" content="Encontre manicures e nail designers da sua cidade, veja os trabalhos e agende na hora.">
<style>
  :root{
    --bg:#140717; --bg2:#1e0b23; --surf:#25102b; --surf2:#311539; --line:#4a2455; --line2:#5e2f6b;
    --text:#fdf2f8; --muted:#c3a0cf; --muted2:#8f76a3;
    --rosa:#ec4899; --rosa-forte:#db2777; --roxo:#7c3aed; --gold:#fbbf24; --verde:#22c55e; --zap:#25d366;
    --shadow:0 8px 30px rgba(0,0,0,.4); --r:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{overflow-x:hidden}
  body{background:radial-gradient(1200px 480px at 50% -120px,#37123f,var(--bg)) fixed;color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased}
  svg{display:block}
  .container{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom))}

  .top{text-align:center;padding:6px 0 2px}
  .brand{display:inline-flex;align-items:center;gap:9px;font-weight:900;letter-spacing:1px;font-size:1.3rem}
  .brand .m{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--rosa),var(--roxo));
    display:flex;align-items:center;justify-content:center;font-size:1.1rem}
  .brand span{background:linear-gradient(90deg,var(--rosa),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
  .top p{color:var(--muted);font-size:.86rem;margin-top:6px}
  .fromcar{display:inline-flex;align-items:center;gap:7px;background:rgba(251,191,36,.14);border:1px solid var(--gold);
    color:var(--gold);border-radius:20px;padding:6px 13px;font-size:.76rem;font-weight:700;margin-top:12px}

  .search{position:relative;margin:18px 0 12px}
  .search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted2);width:18px;height:18px}
  .search input{width:100%;background:var(--bg2);border:1.5px solid var(--line);border-radius:13px;
    padding:14px 15px 14px 42px;color:var(--text);font-size:1rem;transition:border-color .15s,box-shadow .15s}
  .search input:focus{outline:none;border-color:var(--rosa);box-shadow:0 0 0 4px rgba(236,72,153,.16)}
  .search input::placeholder{color:var(--muted2)}

  .filtros{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;-webkit-overflow-scrolling:touch}
  .filtros::-webkit-scrollbar{display:none}
  .fchip{flex:0 0 auto;padding:8px 14px;border-radius:20px;border:1.5px solid var(--line);background:var(--surf);
    color:var(--muted);font-size:.82rem;font-weight:700;cursor:pointer;white-space:nowrap}
  .fchip.on{border-color:var(--rosa);background:rgba(236,72,153,.2);color:var(--text)}

  .count{font-size:.78rem;color:var(--muted2);font-weight:700;margin:4px 2px 12px}

  .card{display:flex;gap:13px;background:var(--surf);border:1px solid var(--line);border-radius:var(--r);
    padding:13px;margin-bottom:11px;box-shadow:var(--shadow);cursor:pointer;transition:transform .08s,border-color .15s}
  .card:active{transform:scale(.99)}
  .card .av{width:70px;height:70px;border-radius:16px;flex-shrink:0;overflow:hidden;display:flex;align-items:center;
    justify-content:center;font-size:1.9rem;background:linear-gradient(135deg,var(--rosa),var(--roxo));border:2px solid var(--gold)}
  .card .av img{width:100%;height:100%;object-fit:cover}
  .card .mid{flex:1;min-width:0}
  .card .nm{font-weight:800;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .loc{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:5px;margin-top:2px}
  .card .loc svg{width:13px;height:13px;color:var(--rosa);flex-shrink:0}
  .card .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .card .tag{font-size:.72rem;font-weight:700;color:var(--gold);background:rgba(251,191,36,.12);
    border:1px solid rgba(251,191,36,.3);border-radius:8px;padding:3px 8px}
  .card .tag.zap{color:var(--zap);background:rgba(37,211,102,.1);border-color:rgba(37,211,102,.3)}
  .card .go{align-self:center;color:var(--muted2);flex-shrink:0}

  .empty{text-align:center;color:var(--muted);font-size:.92rem;padding:50px 20px}
  .empty .big{font-size:2.4rem;margin-bottom:10px}
  .carregando{text-align:center;padding:90px 20px;color:var(--muted)}

  footer{text-align:center;color:var(--muted2);font-size:.76rem;padding:30px 0 4px}
  footer .badge{display:inline-flex;align-items:center;gap:7px;background:var(--surf);border:1px solid var(--line);
    border-radius:20px;padding:7px 14px;margin-top:8px;color:var(--muted);font-weight:700}
  footer .badge b{background:linear-gradient(90deg,var(--rosa),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:1px}
</style>
</head>
<body>
<div class="container" id="app"><div class="carregando">💅<br>Carregando as manicures…</div></div>

<script>
const SUPA_URL='https://jozjhdjfjcyvdkmwpkra.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpvempoZGpmamN5dmRrbXdwa3JhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3MDY0NDIsImV4cCI6MjA5OTI4MjQ0Mn0.i17NGLUyhIgHrrQQtXNxaIQv3q6Mb84bqGZSnZNxWRo';
async function rpc(fn,args){
  const r=await fetch(SUPA_URL+'/rest/v1/rpc/'+fn,{method:'POST',
    headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify(args||{})});
  if(!r.ok) throw new Error('rede'); return r.json();
}
const IC={
  search:'<circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
  pin:'<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>',
  chev:'<polyline points="9 18 15 12 9 6"/>',
  car:'<path d="M5 17h14M6 17l1.5-5h9L18 17M7 12l1-4h8l1 4"/><circle cx="7.5" cy="17.5" r="1.5"/><circle cx="16.5" cy="17.5" r="1.5"/>',
  star:'<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>'
};
function ic(n,s){return `<svg viewBox="0 0 24 24" width="${s||24}" height="${s||24}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[n]||''}</svg>`;}
// escapa texto que veio do banco antes de jogar no HTML (nome/bio/bairro são digitados por gente)
const esc=s=>(s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const $=s=>document.querySelector(s);
const params=new URLSearchParams(location.search);
// carro que trouxe a cliente — guarda pra atribuir a indicação e repassar ao agendamento
const carro=params.get('carro')||localStorage.getItem('mm_carro')||'';
if(params.get('carro')) localStorage.setItem('mm_carro', params.get('carro'));

let saloes=[], bairroSel='', busca='';

function precoMin(servicos){
  const ps=(servicos||[]).map(s=>+s.preco).filter(p=>p>0);
  return ps.length?Math.min(...ps):0;
}
function linkSalao(s){
  let u='portfolio.html?s='+encodeURIComponent(s.slug);
  if(carro) u+='&carro='+encodeURIComponent(carro);
  return u;
}

async function carregar(){
  try{saloes=await rpc('cu_studios_listar');}
  catch(e){$('#app').innerHTML=`<div class="empty"><div class="big">😕</div>Não consegui carregar agora.<br>Tenta de novo daqui a pouco.</div>`;return;}
  render();
}
function render(){
  const bairros=[...new Set(saloes.map(s=>(s.bairro||'').trim()).filter(Boolean))].sort();
  $('#app').innerHTML=`
    <div class="top">
      <div class="brand"><span class="m">💅</span><span>MAPA MULHER</span></div>
      <p>Manicures e nail designers perto de você ✨</p>
      ${carro?`<div class="fromcar">${ic('car',14)} Você veio pelo carro <b>&nbsp;${esc(carro)}</b></div>`:''}
    </div>
    <div class="search">${ic('search')}<input id="q" placeholder="Buscar por nome do studio..." value="${esc(busca)}" oninput="onBusca(this.value)"></div>
    ${bairros.length?`<div class="filtros" id="filtros">
      <div class="fchip ${bairroSel===''?'on':''}" onclick="setBairro('')">Todos</div>
      ${bairros.map(b=>`<div class="fchip ${bairroSel===b?'on':''}" onclick="setBairro('${esc(b).replace(/'/g,'&#39;')}')">${esc(b)}</div>`).join('')}
    </div>`:''}
    <div id="lista"></div>
    <footer>Encontrou pelo <b>MAPA MULHER</b><br>
      <span class="badge">${ic('star',14)} Powered by <b>DYMANI</b></span></footer>`;
  renderLista();
}
function renderLista(){
  const q=busca.trim().toLowerCase();
  const arr=saloes.filter(s=>{
    const okB=!bairroSel||(s.bairro||'').trim()===bairroSel;
    const okQ=!q||(s.nome||'').toLowerCase().includes(q)||(s.bairro||'').toLowerCase().includes(q);
    return okB&&okQ;
  });
  const box=$('#lista');
  if(!arr.length){box.innerHTML=`<div class="empty"><div class="big">🔎</div>Nenhuma manicure encontrada${bairroSel?' em '+esc(bairroSel):''}.<br>Tenta outro bairro ou limpa a busca.</div>`;return;}
  box.innerHTML=`<div class="count">${arr.length} ${arr.length===1?'manicure':'manicures'} ${bairroSel?'em '+esc(bairroSel):'na sua região'}</div>`+
    arr.map(s=>{
      const pm=precoMin(s.servicos), loc=[s.bairro,s.cidade].filter(Boolean).map(esc).join(' · ');
      return `<div class="card" onclick="location.href='${linkSalao(s)}'">
        <div class="av">${s.logo?`<img src="${esc(s.logo)}" alt="">`:'💅'}</div>
        <div class="mid">
          <div class="nm">${esc(s.nome)}</div>
          ${loc?`<div class="loc">${ic('pin',13)} ${loc}</div>`:''}
          <div class="tags">
            ${pm?`<span class="tag">a partir de R$ ${pm}</span>`:''}
            ${s.nfotos?`<span class="tag">${s.nfotos} trabalho${s.nfotos>1?'s':''}</span>`:''}
            <span class="tag zap">agenda aberta</span>
          </div>
        </div>
        <div class="go">${ic('chev',22)}</div>
      </div>`;}).join('');
}
function onBusca(v){busca=v;renderLista();}
function setBairro(b){bairroSel=b;render();}
carregar();
</script>
</body>
</html>
