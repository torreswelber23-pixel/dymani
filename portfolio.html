<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0a1a">

<!-- =============================================================
     DYMANI — Portfólio público + agendamento em tempo real
     portfolio.html?s=slug-do-studio  (sem ?s= abre a demo)
     Link de indicação: ...&ind=NomeDaCliente
     A manicure edita tudo em painel.html
     Página pensada pra CONVERTER: carrossel-herói com as fotos,
     serviços com foto e preço, barra fixa de agendamento.
     ============================================================= -->

<title>Dymani — Portfólio e Agendamento</title>
<meta name="description" content="Veja os trabalhos, agende seu horário e ganhe pontos no Clube Dymani.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
  --bg:#0f0a1a; --bg2:#161024; --surf:#1e1432; --surf2:#2a1d42;
  --line:#362654; --line2:#4a3570;
  --text:#faf5ff; --muted:#c4b5d0; --muted2:#8b7a9e;
  --rosa:#f472b6; --rosa-forte:#ec4899; --roxo:#a855f7;
  --gold:#fcd34d; --verde:#34d399; --verm:#fb7185; --zap:#25d366;
  --shadow:0 12px 40px rgba(0,0,0,.5); --r:20px;
}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  html,body{overflow-x:hidden}
  body{background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased}
  svg{display:block}
  .container{max-width:540px;margin:0 auto;padding:0 16px calc(120px + env(safe-area-inset-bottom))}

  /* ---- herói com carrossel (as fotos passando sozinhas) ---- */
  .hero{position:relative;height:min(72vh,620px);min-height:440px;overflow:hidden;background:#161024}
  .hslide{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease}
  .hslide.on{opacity:1}
  .hslide img{width:100%;height:100%;object-fit:cover;animation:kenburns 10s ease-out infinite alternate}
  @keyframes kenburns{0%{transform:scale(1) translateY(0)}100%{transform:scale(1.09) translateY(-12px)}}
  .hgrad{position:absolute;inset:0;background:
    linear-gradient(to bottom,rgba(15,10,26,.45) 0%,rgba(15,10,26,0) 30%,rgba(15,10,26,0) 45%,rgba(15,10,26,.94) 88%,var(--bg) 100%)}
  .hcontent{position:absolute;left:0;right:0;bottom:26px;text-align:center;padding:0 22px;z-index:2}
  .havatar{width:86px;height:86px;border-radius:50%;margin:0 auto 10px;border:3px solid var(--gold);
    background:linear-gradient(135deg,var(--rosa),var(--roxo));display:flex;align-items:center;justify-content:center;
    font-size:2rem;overflow:hidden;box-shadow:0 10px 34px rgba(0,0,0,.55)}
  .havatar img{width:100%;height:100%;object-fit:cover}
  .hcontent h1{font-size:1.65rem;letter-spacing:-.3px;text-shadow:0 2px 14px rgba(0,0,0,.6)}
  .hbio{color:var(--muted);font-size:.9rem;margin-top:2px;text-shadow:0 1px 8px rgba(0,0,0,.7)}
  .hpills{display:flex;justify-content:center;gap:8px;margin-top:10px;flex-wrap:wrap}
  .pill{display:inline-flex;align-items:center;gap:5px;background:rgba(37,16,43,.75);border:1px solid var(--line);
    border-radius:20px;padding:5px 12px;font-size:.74rem;color:var(--muted);font-weight:700;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  .pill svg{width:13px;height:13px;color:var(--gold)}
  .hero-cta{margin:14px auto 0;max-width:340px;animation:pulsecta 2.8s ease-in-out infinite}
  @keyframes pulsecta{0%,100%{box-shadow:0 6px 18px rgba(219,39,119,.32)}50%{box-shadow:0 6px 30px rgba(236,72,153,.62)}}
  .hdots{position:absolute;top:calc(14px + env(safe-area-inset-top));left:0;right:0;display:flex;
    justify-content:center;gap:6px;z-index:2}
  .hdots span{width:26px;height:3.5px;border-radius:3px;background:rgba(255,255,255,.28);transition:background .4s;cursor:pointer}
  .hdots span.on{background:#fff}

  .btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
    background:linear-gradient(90deg,var(--rosa-forte),var(--roxo));color:#fff;border:none;font-weight:700;
    font-size:1.02rem;padding:15px;border-radius:14px;text-decoration:none;cursor:pointer;margin-top:10px;
    box-shadow:0 6px 18px rgba(219,39,119,.32)}
  .btn:active{transform:translateY(1px);opacity:.92}
  .btn.zap{background:var(--zap);box-shadow:0 6px 18px rgba(37,211,102,.28)}
  .btn.gold{background:linear-gradient(90deg,var(--gold),#f59e0b);color:#2a1704;box-shadow:0 6px 18px rgba(251,191,36,.28)}
  .btn.ghost{background:var(--surf);border:1px solid var(--line);color:var(--text);box-shadow:none}
  .btn svg{width:19px;height:19px}

  /* ---- animação de entrada ao rolar ---- */
  .reveal{opacity:0;transform:translateY(26px);transition:opacity .7s ease,transform .7s ease}
  .reveal.in{opacity:1;transform:none}

  .banner{display:flex;align-items:center;gap:12px;background:linear-gradient(100deg,rgba(251,191,36,.15),rgba(236,72,153,.15));
    border:1px solid var(--gold);border-radius:var(--r);padding:13px 15px;margin:16px 0 0;font-size:.85rem}
  .banner .bi{width:38px;height:38px;border-radius:11px;background:rgba(251,191,36,.2);color:var(--gold);
    display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .banner b{color:var(--gold)}

  /* ---- como funciona (3 passos de conversão) ---- */
  .como{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
  .como .cbx{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:13px 9px;text-align:center}
  .como .cbx .em{font-size:1.5rem}
  .como .cbx b{display:block;font-size:.76rem;margin-top:5px;line-height:1.3}
  .como .cbx span{display:block;font-size:.66rem;color:var(--muted2);margin-top:2px;line-height:1.3}

  .eyebrow{display:flex;align-items:center;gap:8px;font-size:.75rem;font-weight:800;letter-spacing:.7px;
    text-transform:uppercase;color:var(--muted2);margin:28px 2px 12px}
  .eyebrow svg{width:15px;height:15px;color:var(--rosa)}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;cursor:pointer;border:1px solid var(--line);
    transition:transform .18s ease}
  .grid img:active{transform:scale(.95)}

  /* ---- serviços com foto (cards que vendem) ---- */
  .svc{display:flex;align-items:center;gap:13px;background:var(--surf);border:1px solid var(--line);
    border-radius:16px;padding:11px;margin-bottom:10px;cursor:pointer;transition:border-color .2s}
  .svc:active{border-color:var(--rosa)}
  .svc .simg{width:86px;height:86px;border-radius:13px;overflow:hidden;flex-shrink:0;border:1px solid var(--line2)}
  .svc .simg img{width:100%;height:100%;object-fit:cover}
  .svc .sinfo{flex:1;min-width:0}
  .svc .snome{font-weight:800;font-size:.98rem;line-height:1.3}
  .svc .spreco{color:var(--gold);font-weight:800;font-size:1.05rem;margin-top:3px}
  .svc .sdesc{color:var(--muted2);font-size:.74rem;margin-top:2px}
  .svc .sbtn{background:linear-gradient(90deg,var(--rosa-forte),var(--roxo));color:#fff;border:none;
    font-weight:700;font-size:.82rem;padding:10px 14px;border-radius:11px;cursor:pointer;flex-shrink:0;
    box-shadow:0 4px 12px rgba(219,39,119,.3)}
  .svc .sbtn:active{transform:scale(.96)}

  .card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:12px;box-shadow:var(--shadow)}
  .step{display:flex;align-items:center;gap:9px;font-size:.9rem;font-weight:700;margin:16px 0 9px}
  .step:first-child{margin-top:0}
  .step .n{width:22px;height:22px;border-radius:50%;background:var(--rosa);color:#fff;display:flex;
    align-items:center;justify-content:center;font-size:.76rem;flex-shrink:0}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surf2);font-size:.85rem;
    font-weight:700;cursor:pointer;text-align:center;transition:transform .08s,border-color .2s,background .2s}
  .chip:active{transform:scale(.97)}
  .chip .sub{display:block;font-size:.68rem;color:var(--muted2);font-weight:600}
  .chip.on{border-color:var(--rosa);background:rgba(236,72,153,.2)}
  .chip.ocupado{opacity:.32;text-decoration:line-through;pointer-events:none}

  /* ---- barra fixa de conversão (aparece quando escolhe o serviço) ---- */
  .sticky{position:fixed;left:0;right:0;bottom:0;z-index:40;transform:translateY(110%);transition:transform .35s ease;
    background:rgba(30,11,35,.96);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border-top:1px solid var(--line2);padding:10px 16px calc(12px + env(safe-area-inset-bottom))}
  .sticky.on{transform:none}
  .sticky .sin{max-width:540px;margin:0 auto;display:flex;align-items:center;gap:12px}
  .sticky .stxt{flex:1;min-width:0}
  .sticky .stxt b{display:block;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sticky .stxt span{font-size:.76rem;color:var(--muted)}
  .sticky .btn{width:auto;margin:0;padding:13px 20px;font-size:.92rem;flex-shrink:0}

  .lightbox,.modal-bg{position:fixed;inset:0;background:rgba(8,3,11,.94);z-index:50;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
  .lightbox img{width:100%;max-width:460px;border-radius:18px}
  .lightbox .leg{color:var(--muted);margin:14px 0;text-align:center}
  .fechar{position:absolute;top:14px;right:16px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.1);
    color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .fechar svg{width:22px;height:22px}
  .modal{background:var(--surf);border:1px solid var(--line2);border-radius:22px;padding:22px;width:100%;max-width:440px;box-shadow:var(--shadow)}
  label{display:block;font-size:.82rem;color:var(--muted);margin:12px 0 5px;font-weight:700}
  input{width:100%;background:var(--bg2);border:1.5px solid var(--line);border-radius:13px;padding:14px 15px;
    color:var(--text);font-size:1rem;transition:border-color .15s,box-shadow .15s}
  input::placeholder{color:var(--muted2)}
  input:focus{outline:none;border-color:var(--rosa);box-shadow:0 0 0 4px rgba(236,72,153,.16)}
  .sucesso{text-align:center}
  .sucesso .big{width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,var(--verde),#16a34a);
    display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
  .sucesso .big svg{width:40px;height:40px;color:#fff}
  .sucesso h2{margin:6px 0}.sucesso p{color:var(--muted);font-size:.92rem;margin:6px 0}
  .sucesso .destaque{color:var(--gold);font-weight:700}

  footer{text-align:center;color:var(--muted2);font-size:.76rem;padding:30px 0 4px}
  footer .badge{display:inline-flex;align-items:center;gap:7px;background:var(--surf);border:1px solid var(--line);
    border-radius:20px;padding:7px 14px;margin-top:10px;color:var(--muted);font-weight:700}
  footer .badge b{background:linear-gradient(90deg,var(--rosa),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:1px}
  .carregando{text-align:center;padding:90px 20px;color:var(--muted)}
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--gold);color:#2a1704;
    font-weight:700;padding:12px 22px;border-radius:30px;z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.4);max-width:90vw;text-align:center}
  #confete{position:fixed;inset:0;pointer-events:none;z-index:60}
</style>

<style id="dymani-premium">
/* ═══════════════════════════════════════════════════════
   DYMANI PREMIUM DESIGN SYSTEM — Upgrade Visual 2026
   Aplicado sobre o CSS existente via variáveis + overrides
   ═══════════════════════════════════════════════════════ */

/* ── Tipografia Premium ── */
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif!important;
  letter-spacing:-.01em}
h1,h2,.sechead,.hero h1,.login-brand,.price .v{
  font-family:'Playfair Display',Georgia,'Times New Roman',serif!important}

/* ── Textura de fundo (pontos sutis) ── */
body{background-image:radial-gradient(rgba(168,85,247,.035) 1px,transparent 1px)!important;
  background-size:28px 28px!important;background-attachment:fixed!important}

/* ── Sparkles decorativos flutuantes ── */
body::before{content:'✦';position:fixed;top:13%;left:7%;font-size:11px;
  color:rgba(252,211,77,.14);animation:dym-float 5s ease-in-out infinite;
  pointer-events:none;z-index:9999}
body::after{content:'✦';position:fixed;top:34%;right:5%;font-size:8px;
  color:rgba(244,114,182,.11);animation:dym-float 6s ease-in-out infinite 2s;
  pointer-events:none;z-index:9999}

/* ── Keyframes ── */
@keyframes dym-float{
  0%,100%{transform:translateY(0) rotate(0deg);opacity:.5}
  50%{transform:translateY(-10px) rotate(12deg);opacity:1}
}
@keyframes dym-shimmer{
  0%{background-position:-200% center}
  100%{background-position:200% center}
}
@keyframes dym-slideUp{
  from{opacity:0;transform:translateY(22px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes dym-pulse{
  0%,100%{box-shadow:0 8px 24px rgba(236,72,153,.3)}
  50%{box-shadow:0 10px 44px rgba(236,72,153,.5),0 0 60px rgba(236,72,153,.1)}
}
@keyframes dym-glow-border{
  0%,100%{border-color:var(--line2)}
  50%{border-color:rgba(244,114,182,.35)}
}
@keyframes dym-entrance{
  from{opacity:0;transform:translateY(16px) scale(.98)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

/* ── Glassmorphism nos cards ── */
.card,.feat,.quote,.servico,.ag,.cli,.row,.atend,.chip{
  background:rgba(30,20,50,.55)!important;
  backdrop-filter:blur(14px)!important;-webkit-backdrop-filter:blur(14px)!important;
  border-color:rgba(168,85,247,.12)!important;
  transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease!important}

/* ── Hover com glow ── */
.feat:hover,.servico:hover,.ag:hover,.cli:hover,.row:hover,.card.tap:active,
.cli:active,.row:active{
  border-color:rgba(244,114,182,.28)!important;
  box-shadow:0 8px 32px rgba(244,114,182,.08),0 0 0 1px rgba(244,114,182,.08)!important;
  transform:translateY(-2px)!important}

/* ── Botão com brilho deslizante ── */
.btn{position:relative!important;overflow:hidden!important;
  transition:transform .2s,opacity .2s,box-shadow .3s!important}
.btn::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);
  transition:left .6s ease;pointer-events:none}
.btn:active::after{left:100%}

/* ── Shimmer em textos gradiente ── */
.hero h1 em,.login-brand,.top .brand span,footer .wm,.badge b{
  background-size:200% auto!important;
  animation:dym-shimmer 3.5s linear infinite!important}

/* ── Float nos ícones de features ── */
.feat .fi,.alert .ci{animation:dym-float 4s ease-in-out infinite!important}
.feat:nth-child(2) .fi{animation-delay:.7s!important}
.feat:nth-child(3) .fi{animation-delay:1.4s!important}
.feat:nth-child(4) .fi{animation-delay:2.1s!important}

/* ── Glow em avatares/logos ── */
.top .brand .m,.login-logo,.appbar .av,.logoprev,.avatar,.appbar .logo,
.mock .nail{box-shadow:0 6px 28px rgba(244,114,182,.25)!important}

/* ── Entrada animada dos elementos ── */
.feat,.step,.ag,.cli,.row,.servico,.atend{
  animation:dym-entrance .5s ease-out both!important}
.feat:nth-child(2),.ag:nth-child(2),.row:nth-child(2),.cli:nth-child(2){animation-delay:.06s!important}
.feat:nth-child(3),.ag:nth-child(3),.row:nth-child(3),.cli:nth-child(3){animation-delay:.12s!important}
.feat:nth-child(4),.ag:nth-child(4),.row:nth-child(4),.cli:nth-child(4){animation-delay:.18s!important}
.feat:nth-child(5),.row:nth-child(5),.cli:nth-child(5){animation-delay:.24s!important}

/* ── Preço com glow dourado ── */
.price{box-shadow:var(--shadow),0 0 60px rgba(252,211,77,.06)!important;
  animation:dym-glow-border 4s ease-in-out infinite}

/* ── CTA com pulse ── */
.hero .ctas>.btn:first-child,.final .btn{animation:dym-pulse 3s ease-in-out infinite!important}

/* ── Chips melhorados ── */
.chip{transition:all .2s ease!important}
.chip.on{box-shadow:0 0 20px rgba(244,114,182,.12)!important;transform:scale(1.03)}

/* ── Selos com glow ── */
.stamps .s.on{box-shadow:0 0 14px rgba(252,211,77,.22)}
.sel.on{box-shadow:0 0 10px rgba(252,211,77,.25)}

/* ── Toast glassmorphism ── */
.toast{background:rgba(42,29,66,.88)!important;
  backdrop-filter:blur(14px)!important;-webkit-backdrop-filter:blur(14px)!important;
  border-color:rgba(168,85,247,.25)!important}

/* ── Modal glassmorphism ── */
.modal{background:rgba(22,16,36,.94)!important;
  backdrop-filter:blur(20px)!important;-webkit-backdrop-filter:blur(20px)!important;
  border-color:rgba(168,85,247,.2)!important}
.modal-bg{backdrop-filter:blur(6px)!important;-webkit-backdrop-filter:blur(6px)!important}

/* ── Tabs com animação ── */
.tabs button{transition:all .2s ease!important}
.tabs button.on{transform:translateY(-2px)}

/* ── Mock card glow ── */
.mock{box-shadow:var(--shadow),0 0 50px rgba(244,114,182,.08)!important;
  animation:dym-entrance .7s ease-out .15s both}

/* ── Login glow intensificado ── */
.login-logo{box-shadow:0 10px 50px rgba(244,114,182,.3),0 0 80px rgba(168,85,247,.12)!important}

/* ── Appbar glassmorphism ── */
.appbar{background:rgba(15,10,26,.88)!important;
  backdrop-filter:blur(16px)!important;-webkit-backdrop-filter:blur(16px)!important}

/* ── Tabs glassmorphism ── */
.tabs{background:rgba(15,10,26,.92)!important;
  backdrop-filter:blur(16px)!important;-webkit-backdrop-filter:blur(16px)!important}

/* ── Grid de fotos com hover ── */
.grid img,.frow3 .fi img,.gal img{transition:transform .3s ease,filter .3s ease!important}
.grid img:hover,.gal img:hover{transform:scale(1.04)!important;filter:brightness(1.1)}

/* ── Empty state sutil ── */
.empty{animation:dym-entrance .6s ease-out!important}

/* ── Scrollbar premium ── */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--rosa)}

/* ── Segmented control ── */
.seg button{transition:all .2s ease!important}
.seg button.on{box-shadow:0 2px 10px rgba(168,85,247,.15)}

/* ── Inputs com focus premium ── */
input:focus,select:focus,textarea:focus{
  border-color:var(--rosa)!important;
  box-shadow:0 0 0 4px rgba(244,114,182,.12)!important;
  outline:none!important}

/* ── Alert/banner com glow ── */
.alert,.banner{animation:dym-entrance .5s ease-out!important;
  box-shadow:0 4px 20px rgba(244,114,182,.08)}

/* ── Lightbox melhorado ── */
.lightbox{backdrop-filter:blur(8px)!important;-webkit-backdrop-filter:blur(8px)!important}
.lightbox img{box-shadow:0 20px 60px rgba(0,0,0,.5);transition:transform .3s!important}

/* ── Tagpill shimmer ── */
.tagpill{backdrop-filter:blur(10px)!important;-webkit-backdrop-filter:blur(10px)!important}

/* ── Footer mais elegante ── */
footer{opacity:.85;transition:opacity .3s!important}
footer:hover{opacity:1}

/* ── Badge do rodapé ── */
.badge{backdrop-filter:blur(8px)!important;-webkit-backdrop-filter:blur(8px)!important}

/* ── Perfil (portfolio) ── */
.perfil,.hdr{position:relative;animation:dym-entrance .6s ease-out!important}

/* ── Nail polish SVG decorativo (via CSS shape) ── */
.hero::after{content:'💅';position:absolute;top:8px;right:-2px;font-size:2rem;
  opacity:.08;animation:dym-float 7s ease-in-out infinite 3s;pointer-events:none}
.final::before{content:'✨';position:absolute;top:12px;left:16px;font-size:1.1rem;
  opacity:.15;animation:dym-float 5s ease-in-out infinite;pointer-events:none}
.final{position:relative;overflow:hidden}

/* ── ajustes da casa em cima da camada premium ──
   o vidro dos chips não pode apagar o destaque do escolhido */
.chip.on{background:rgba(236,72,153,.26)!important;border-color:var(--rosa)!important}

</style>
</head>

  zap:'FILL:<path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38c1.45.79 3.08 1.21 4.79 1.21 5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2zm0 18.15c-1.53 0-3.03-.41-4.34-1.19l-.31-.18-3.12.82.83-3.04-.2-.32a8.2 8.2 0 0 1-1.26-4.36c0-4.54 3.7-8.24 8.24-8.24 2.2 0 4.27.86 5.82 2.42a8.18 8.18 0 0 1 2.41 5.83c0 4.54-3.7 8.24-8.24 8.24zm4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.12-.17.25-.64.81-.79.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.02-.38.11-.51.11-.11.25-.29.37-.43.13-.14.17-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.4-.42-.56-.43-.14-.01-.31-.01-.48-.01-.17 0-.43.06-.66.31-.23.25-.87.85-.87 2.07 0 1.22.89 2.4 1.01 2.56.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.14-1.18-.06-.11-.22-.17-.47-.29z"/>'
};
function ic(n,s){const raw=IC[n]||'',f=raw.startsWith('FILL:');
  return `<svg viewBox="0 0 24 24" width="${s||24}" height="${s||24}" fill="${f?'currentColor':'none'}" stroke="${f?'none':'currentColor'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${f?raw.slice(5):raw}</svg>`;}

const $=s=>document.querySelector(s);
const params=new URLSearchParams(location.search);
const slug=params.get('s')||'studio-demo';
const ind=params.get('ind')||'';
const DIAS=['dom','seg','ter','qua','qui','sex','sáb'];
let studio=null, sel={servico:null,dia:null,hora:null};

function fotoSrc(f,i){
  if(f&&f.img) return f.img;
  const cores=[['#7a2048','#c94f7c'],['#f5d0dc','#e8a0b8'],['#d4a373','#f5e6d3'],['#e75480','#ffb6c1'],['#4a1942','#9b4d8f'],['#5b8db8','#a8d0e6']];
  const[a,b]=cores[i%cores.length];
  return 'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="400" height="400" fill="url(#g)"/><text x="200" y="245" font-size="130" text-anchor="middle">💅</text></svg>`);
}
// foto do serviço: a dele > uma foto do portfólio > placeholder bonito
function servImg(s,i){
  if(s.img)return s.img;
  const f=(studio.fotos||[]).filter(x=>x&&x.img);
  if(f.length)return f[i%f.length].img;
  return fotoSrc(null,i);
}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}

async function carregar(){
  try{studio=await rpc('cu_studio_publico',{p_slug:slug});if(!studio)throw 0;render();}
  catch(e){$('#app').innerHTML=`<div class="carregando">😕 Não encontrei esse studio.<br><br>Confira o link ou fale com quem te enviou.</div>`;}
}
function render(){
  const fotos=(studio.fotos&&studio.fotos.length)?studio.fotos:[0,1,2,3,4,5].map(i=>({img:null,leg:'Trabalho do studio 💅'}));
  const heroFotos=fotos.slice(0,6);
  $('#app').innerHTML=`
    <!-- herói com as fotos passando -->
    <div class="hero" id="hero">
      ${heroFotos.map((f,i)=>`<div class="hslide ${i===0?'on':''}"><img src="${fotoSrc(f,i)}" alt=""></div>`).join('')}
      <div class="hgrad"></div>
      <div class="hdots" id="hdots">${heroFotos.map((_,i)=>`<span class="${i===0?'on':''}" onclick="irSlide(${i})"></span>`).join('')}</div>
      <div class="hcontent">
        <div class="havatar">${studio.logo?`<img src="${studio.logo}">`:'💅'}</div>
        <h1>${studio.nome}</h1>
        ${studio.bio?`<div class="hbio">${studio.bio}</div>`:''}
        <div class="hpills">
          <span class="pill">${ic('work',13)} ${fotos.length} trabalhos</span>
          <span class="pill">${ic('star',13)} Clube Dymani</span>
        </div>
        <a class="btn hero-cta" onclick="document.getElementById('agendar').scrollIntoView({behavior:'smooth'})">${ic('calendar',19)} Agendar meu horário</a>
      </div>
    </div>

    <div class="container">
      ${ind?`<div class="banner reveal"><div class="bi">${ic('gift',20)}</div><div>Você veio pela <b>${ind}</b>! Agendando por aqui <b>vocês duas ganham pontos</b> — junte ${studio.meta} e a unha é grátis 🎁</div></div>`
        :`<div class="banner reveal"><div class="bi">${ic('star',20)}</div><div><b>Agendou, pontuou!</b> Cada visita vale ponto no Clube Dymani — junte ${studio.meta} e ganhe uma unha grátis 🎁</div></div>`}

      <div class="como reveal">
        <div class="cbx"><div class="em">📅</div><b>Escolha o horário</b><span>vagas em tempo real</span></div>
        <div class="cbx"><div class="em">⭐</div><b>Ganhe ponto</b><span>a cada visita</span></div>
        <div class="cbx"><div class="em">🎁</div><b>Unha grátis</b><span>com ${studio.meta} pontos</span></div>
      </div>

      <div class="eyebrow reveal">${ic('scissors')} Serviços</div>
      <div class="reveal">
      ${(studio.servicos||[]).map((s,i)=>`
        <div class="svc" onclick="escolherServCard(${i})">
          <div class="simg"><img src="${servImg(s,i)}" alt="${s.nome}"></div>
          <div class="sinfo">
            <div class="snome">${s.nome}</div>
            <div class="spreco">R$ ${s.preco}</div>
            <div class="sdesc">toque pra agendar ✨</div>
          </div>
          <button class="sbtn">Agendar</button>
        </div>`).join('')}
      </div>

      <div class="eyebrow reveal">${ic('image')} Trabalhos</div>
      <div class="grid reveal">${fotos.map((f,i)=>`<img src="${fotoSrc(f,i)}" alt="" loading="lazy" onclick="abrirFoto(${i})">`).join('')}</div>

      <div class="eyebrow reveal" id="agendar">${ic('calendar')} Agendar horário</div>
      <div class="card reveal">
        <div class="step"><span class="n">1</span> Escolha o serviço</div>
        <div class="chips" id="c-serv">${(studio.servicos||[]).map((s,i)=>`<div class="chip" data-i="${i}" onclick="escolherServ(${i},this)">${s.nome}</div>`).join('')}</div>
        <div class="step"><span class="n">2</span> Escolha o dia</div>
        <div class="chips" id="c-dias">${diasHTML()}</div>
        <div class="step"><span class="n">3</span> Escolha o horário</div>
        <div class="chips" id="c-horas"><span style="color:var(--muted2);font-size:.85rem">Escolha um dia primeiro 😊</span></div>
        <button class="btn" onclick="abrirConfirmacao()">${ic('star',19)} Agendar e ganhar meu ponto</button>
      </div>

      <button class="btn gold reveal" onclick="divulgar()">${ic('star',19)} Divulgar e ganhar pontos</button>

      <footer>💅 ${studio.nome}<br>
        <span class="badge">${ic('star',14)} <b>DYMANI</b> · Tecnologia · Conexão · Resultados</span></footer>
    </div>

    <!-- barra fixa de conversão -->
    <div class="sticky" id="sticky"><div class="sin">
      <div class="stxt"><b id="st-serv"></b><span id="st-quando"></span></div>
      <button class="btn" onclick="abrirConfirmacao()">${ic('check',18)} Agendar</button>
    </div></div>`;
  window._fotos=fotos;
  iniciarCarrossel(heroFotos.length);
  iniciarReveal();
}

/* ---- carrossel do herói: passa sozinho, aceita arrastar e tocar nos tracinhos ---- */
let slideAtual=0,slideTimer=null,slideTotal=0;
function iniciarCarrossel(total){
  slideTotal=total;slideAtual=0;
  clearInterval(slideTimer);
  if(total>1)slideTimer=setInterval(()=>irSlide((slideAtual+1)%slideTotal,true),3800);
  // swipe
  const hero=$('#hero');let x0=null;
  hero.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;},{passive:true});
  hero.addEventListener('touchend',e=>{
    if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;
    if(Math.abs(dx)<40)return;
    irSlide((slideAtual+(dx<0?1:slideTotal-1))%slideTotal);
  },{passive:true});
}
function irSlide(i,auto){
  if(!auto){clearInterval(slideTimer);if(slideTotal>1)slideTimer=setInterval(()=>irSlide((slideAtual+1)%slideTotal,true),3800);}
  slideAtual=i;
  document.querySelectorAll('.hslide').forEach((s,j)=>s.classList.toggle('on',j===i));
  document.querySelectorAll('#hdots span').forEach((d,j)=>d.classList.toggle('on',j===i));
}

/* ---- seções aparecendo ao rolar ---- */
function iniciarReveal(){
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.12});
  document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
}

function diasHTML(){
  let html='';
  for(let i=0;i<10;i++){const d=new Date(Date.now()+i*864e5);
    if(!studio.horarios||!studio.horarios[d.getDay()])continue;
    const iso=new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
    html+=`<div class="chip" data-iso="${iso}" data-dow="${d.getDay()}" onclick="escolherDia(this)">
      ${i===0?'Hoje':i===1?'Amanhã':DIAS[d.getDay()]}<span class="sub">${d.getDate()}/${d.getMonth()+1}</span></div>`;}
  return html||'<span style="color:var(--muted2)">Consulte os horários no WhatsApp 😊</span>';
}
// clicou no card do serviço: já marca no agendamento e desce até lá
function escolherServCard(i){
  const chip=document.querySelector(`#c-serv .chip[data-i="${i}"]`);
  if(chip)escolherServ(i,chip);
  document.getElementById('agendar').scrollIntoView({behavior:'smooth'});
  toast(`${studio.servicos[i].nome} escolhido ✨ agora o dia e a hora`);
}
function escolherServ(i,el){sel.servico=i;el.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));el.classList.add('on');attSticky();}
async function escolherDia(el){
  sel.dia=el.dataset.iso;sel.hora=null;attSticky();
  el.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));el.classList.add('on');
  $('#c-horas').innerHTML='<span style="color:var(--muted2);font-size:.85rem">Vendo horários livres… 👀</span>';
  let ocupados=[];try{ocupados=await rpc('cu_ocupados',{p_slug:slug,p_dia:sel.dia});}catch(e){}
  const horas=(studio.horarios&&studio.horarios[el.dataset.dow])||[];
  $('#c-horas').innerHTML=horas.map(h=>{const o=ocupados.includes(h);
    return `<div class="chip ${o?'ocupado':''}" onclick="escolherHora('${h}',this)">${h}${o?'<span class="sub">ocupado</span>':''}</div>`;}).join('')
    ||'<span style="color:var(--muted2)">Sem horários nesse dia 😕</span>';
}
function escolherHora(h,el){sel.hora=h;el.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));el.classList.add('on');attSticky();}

/* barra fixa: resume a escolha e deixa o botão sempre a um toque */
function attSticky(){
  const st=$('#sticky');if(!st)return;
  if(sel.servico===null){st.classList.remove('on');return;}
  const s=studio.servicos[sel.servico];
  $('#st-serv').textContent=`${s.nome} · R$ ${s.preco}`;
  let q='agora escolha o dia e a hora 😊';
  if(sel.dia){const[a,m,d]=sel.dia.split('-');
    q=sel.hora?`${d}/${m} às ${sel.hora} — só confirmar!`:`${d}/${m} · falta escolher a hora`;}
  $('#st-quando').textContent=q;
  st.classList.add('on');
}

function abrirConfirmacao(){
  if(sel.servico===null||!sel.dia||!sel.hora){toast('Escolha serviço, dia e horário 😊');
    document.getElementById('agendar').scrollIntoView({behavior:'smooth'});return;}
  const s=studio.servicos[sel.servico],[a,m,d]=sel.dia.split('-');
  const bg=document.createElement('div');bg.className='modal-bg';
  bg.innerHTML=`<div class="modal"><h2 style="margin:0">Quase lá! 💅</h2>
    <p style="color:var(--muted);font-size:.88rem;margin-top:4px">${s.nome} · ${d}/${m} às ${sel.hora}</p>
    <label>Seu nome</label><input id="m-nome" placeholder="Como você se chama?">
    <label>Seu WhatsApp</label><input id="m-zap" inputmode="numeric" placeholder="Com DDD, ex: 83988887777">
    <button class="btn" onclick="confirmarAgendamento(this)">${ic('check',19)} Confirmar agendamento</button>
    <button class="btn ghost" onclick="this.closest('.modal-bg').remove()">Voltar</button></div>`;
  bg.onclick=e=>{if(e.target===bg)bg.remove();};document.body.appendChild(bg);
}
async function confirmarAgendamento(btn){
  const nome=$('#m-nome').value.trim(), zap=($('#m-zap').value||'').replace(/\D/g,'');
  if(nome.length<2||zap.length<10){toast('Preencha seu nome e WhatsApp 😊');return;}
  btn.disabled=true;btn.innerHTML='Agendando… ✨';
  const s=studio.servicos[sel.servico];let res='erro';
  try{res=await rpc('cu_agendar',{p_slug:slug,p_servico:s.nome,p_dia:sel.dia,p_hora:sel.hora,
    p_nome:nome,p_zap:zap.startsWith('55')?zap:'55'+zap,p_indicou:ind});}catch(e){}
  if(res==='ok'){$('#sticky').classList.remove('on');telaSucesso(nome,s);return;}
  btn.disabled=false;btn.innerHTML=ic('check',19)+' Confirmar agendamento';
  if(res==='ocupado'){toast('Ih, esse horário acabou de ser pego! Escolha outro 🥺');
    document.querySelector('.modal-bg').remove();const de=document.querySelector('#c-dias .chip.on');if(de)escolherDia(de);}
  else toast('Falha na conexão — tenta de novo 😊');
}
function telaSucesso(nome,s){
  const[a,m,d]=sel.dia.split('-'),bg=document.querySelector('.modal-bg');
  bg.innerHTML=`<div class="modal sucesso"><div class="big">${ic('check',40)}</div>
    <h2>Agendado, ${nome.split(' ')[0]}!</h2>
    <p><b>${s.nome}</b><br>${d}/${m} às ${sel.hora}</p>
    <p class="destaque">⭐ +1 ponto no Clube Dymani!<br>Junte ${studio.meta} e sua unha é grátis 🎁</p>
    ${ind?`<p>💖 A ${ind} também pontuou por te indicar!</p>`:''}
    <a class="btn zap" href="https://wa.me/${studio.zap}?text=${encodeURIComponent(`Oi! Acabei de agendar pelo site 🎉\n✨ ${s.nome}\n🗓️ ${d}/${m} às ${sel.hora}\n— ${nome}${ind?' (vim pela '+ind+' 💖)':''}`)}" target="_blank">${ic('zap',19)} Avisar no WhatsApp</a>
    <button class="btn gold" onclick="this.closest('.modal-bg').remove();divulgar()">${ic('star',19)} Divulgar e ganhar mais pontos</button>
    <button class="btn ghost" onclick="this.closest('.modal-bg').remove()">Fechar</button></div>`;
  confete();
}
function confete(){
  const cv=$('#confete'),x=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
  const cores=['#ec4899','#7c3aed','#fbbf24','#22c55e','#f472b6','#fff'];
  const pecas=Array.from({length:160},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,
    w:8+Math.random()*8,h:6+Math.random()*6,cor:cores[Math.floor(Math.random()*cores.length)],
    vy:2.5+Math.random()*3.5,vx:-1.5+Math.random()*3,rot:Math.random()*6.3,vr:-.15+Math.random()*.3}));
  let q=0;(function anima(){x.clearRect(0,0,cv.width,cv.height);
    pecas.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.rot);
      x.fillStyle=p.cor;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore();});
    if(++q<240)requestAnimationFrame(anima);else x.clearRect(0,0,cv.width,cv.height);})();
}
function abrirFoto(i){
  const f=window._fotos[i],bg=document.createElement('div');bg.className='lightbox';
  bg.innerHTML=`<button class="fechar" onclick="this.parentElement.remove()">${ic('x',22)}</button>
    <img src="${fotoSrc(f,i)}"><div class="leg">${f.leg||''}</div>
    <button class="btn" style="max-width:460px" onclick="this.closest('.lightbox').remove();document.getElementById('agendar').scrollIntoView({behavior:'smooth'})">${ic('star',19)} Quero igual — agendar</button>`;
  bg.onclick=e=>{if(e.target===bg)bg.remove();};document.body.appendChild(bg);
}
async function divulgar(){
  const nome=prompt('Seu nome (pra você ganhar os pontos das amigas que agendarem):');
  if(!nome)return;
  const url=location.origin+location.pathname+'?s='+encodeURIComponent(slug)+'&ind='+encodeURIComponent(nome.trim());
  const texto=`💅 Gente, olha os trabalhos de ${studio.nome}! Amei o meu 😍\nAgenda pelo meu link que a gente ganha pontos e unha grátis: ${url}`;
  try{if(navigator.share){await navigator.share({text:texto});return;}}catch(e){}
  try{await navigator.clipboard.writeText(texto);toast('Copiado! Cola no seu status 💖');}
  catch(e){prompt('Copie o texto:',texto);}
}
carregar();
</script>
