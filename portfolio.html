<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ============================================================
     PORTFÓLIO + AGENDAMENTO EM TEMPO REAL — Clube Dymani
     Cada manicure tem sua página: portfolio.html?s=slug-do-studio
     (sem ?s= abre o studio de demonstração)
     A manicure edita tudo no painel: painel.html
     Link de indicação: ...&ind=NomeDaCliente
     ============================================================ -->

<title>Dymani Link — Portfólio e Agendamento</title>
<meta name="description" content="Veja os trabalhos, agende seu horário e ganhe pontos no Clube Dymani.">
<style>
  :root{
    --bg:#1a0a1e; --card:#2a1230; --card2:#3a1a42; --border:#552a60;
    --text:#fdf2f8; --muted:#c9a0d4;
    --rosa:#ec4899; --rosa-forte:#db2777; --roxo:#7c3aed;
    --gold:#fbbf24; --verde:#22c55e; --zap:#25d366;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:radial-gradient(1200px 500px at 50% -100px,#3a1245,var(--bg));color:var(--text);font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;line-height:1.5;min-height:100vh}
  .container{max-width:520px;margin:0 auto;padding:16px 16px 90px}
  .perfil{display:flex;align-items:center;gap:16px;padding:12px 0}
  .avatar{width:88px;height:88px;border-radius:50%;background:linear-gradient(135deg,var(--rosa),var(--roxo));display:flex;align-items:center;justify-content:center;font-size:2rem;border:3px solid var(--gold);flex-shrink:0;overflow:hidden;box-shadow:0 4px 20px rgba(236,72,153,.35)}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .perfil h1{font-size:1.3rem}
  .perfil .bio{color:var(--muted);font-size:.85rem}
  .stats{display:flex;gap:18px;margin-top:4px;font-size:.8rem;color:var(--muted)}
  .stats b{color:var(--gold)}
  .btn{display:block;width:100%;background:linear-gradient(90deg,var(--rosa-forte),var(--roxo));color:#fff;border:none;font-weight:700;font-size:1.05rem;padding:15px;border-radius:14px;text-align:center;text-decoration:none;cursor:pointer;margin-top:10px;box-shadow:0 4px 14px rgba(219,39,119,.3)}
  .btn:active{opacity:.85}
  .btn.zap{background:var(--zap);box-shadow:0 4px 14px rgba(37,211,102,.25)}
  .btn.gold{background:linear-gradient(90deg,var(--gold),#f59e0b);color:#241303;box-shadow:0 4px 14px rgba(251,191,36,.25)}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text);font-weight:600;box-shadow:none}
  .pontos-banner{background:linear-gradient(90deg,rgba(251,191,36,.16),rgba(236,72,153,.16));border:1px solid var(--gold);border-radius:14px;padding:13px;text-align:center;font-size:.88rem;margin:10px 0}
  h2{font-size:1.1rem;margin:24px 0 10px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  .grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:pointer}
  .servico{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
  .servico .preco{color:var(--gold);font-weight:800}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
  .chip{padding:10px 14px;border-radius:12px;border:2px solid var(--border);background:var(--card);font-size:.85rem;font-weight:700;cursor:pointer;text-align:center}
  .chip .sub{display:block;font-size:.7rem;color:var(--muted);font-weight:400}
  .chip.on{border-color:var(--rosa);background:rgba(236,72,153,.18)}
  .chip.ocupado{opacity:.35;text-decoration:line-through;pointer-events:none}
  .lightbox,.modal-bg{position:fixed;inset:0;background:rgba(10,4,14,.95);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
  .lightbox img{width:100%;max-width:480px;border-radius:16px}
  .lightbox .leg{color:var(--muted);margin:12px 0;text-align:center}
  .fechar{position:absolute;top:16px;right:20px;font-size:2rem;color:#fff;background:none;border:none;cursor:pointer}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px}
  .modal{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:22px;width:100%;max-width:440px}
  label{display:block;font-size:.85rem;color:var(--muted);margin:12px 0 4px;font-weight:600}
  input{width:100%;background:linear-gradient(180deg,#3a1a42,#321640);border:1.5px solid var(--border);border-radius:14px;padding:14px 16px;color:var(--text);font-size:1rem;transition:border-color .2s,box-shadow .2s}
  input::placeholder{color:#8f76a3}
  input:focus{outline:none;border-color:var(--rosa);box-shadow:0 0 0 4px rgba(236,72,153,.18)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--gold);color:#241303;font-weight:700;padding:12px 22px;border-radius:30px;z-index:99;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.4)}
  .sucesso{text-align:center;padding:10px}
  .sucesso .emoji{font-size:4rem}
  .sucesso h2{margin:8px 0}
  .sucesso p{color:var(--muted);font-size:.92rem;margin:6px 0}
  .sucesso .destaque{color:var(--gold);font-weight:700}
  footer{text-align:center;color:var(--muted);font-size:.75rem;padding:26px 0 10px}
  .carregando{text-align:center;padding:80px 20px;color:var(--muted)}
  #confete{position:fixed;inset:0;pointer-events:none;z-index:60}
</style>
</head>
<body>
<canvas id="confete"></canvas>
<div class="container" id="app"><div class="carregando">💅<br>Carregando o studio…</div></div>

<script>
/* ---------- conexão (tempo real via Supabase) ---------- */
const SUPA_URL = 'https://rhveqvlldliccalfsuea.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJodmVxdmxsZGxpY2NhbGZzdWVhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExMjg5MjMsImV4cCI6MjA5NjcwNDkyM30.NrsH1optDK2IbOl8YUqBwUZaidvEk72lvrA4SEHPrVY';
async function rpc(fn, args){
  const r = await fetch(SUPA_URL + '/rest/v1/rpc/' + fn, {
    method: 'POST',
    headers: { apikey: SUPA_KEY, Authorization: 'Bearer ' + SUPA_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(args)
  });
  if (!r.ok) throw new Error('rede');
  return r.json();
}

const $ = s => document.querySelector(s);
const params = new URLSearchParams(location.search);
const slug = params.get('s') || 'studio-demo';
const ind = params.get('ind') || '';
const DIAS = ['dom','seg','ter','qua','qui','sex','sáb'];
let studio = null;
let sel = { servico: null, dia: null, hora: null };

function fotoSrc(f, i){
  if (f && f.img) return f.img;
  const cores = [['#7a2048','#c94f7c'],['#f5d0dc','#e8a0b8'],['#d4a373','#f5e6d3'],['#e75480','#ffb6c1'],['#4a1942','#9b4d8f'],['#5b8db8','#a8d0e6']];
  const [a,b] = cores[i % cores.length];
  return 'data:image/svg+xml,' + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="400" height="400" fill="url(#g)"/><text x="200" y="245" font-size="130" text-anchor="middle">💅</text></svg>`);
}
function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

/* ---------- carga ---------- */
async function carregar(){
  try {
    studio = await rpc('cu_studio_publico', { p_slug: slug });
    if (!studio) throw new Error('nao_existe');
    render();
  } catch(e) {
    $('#app').innerHTML = `<div class="carregando">😕 Não encontrei esse studio.<br><br>
      Confira o link ou fale com quem te enviou.</div>`;
  }
}

function render(){
  const fotos = (studio.fotos && studio.fotos.length) ? studio.fotos
    : [0,1,2,3,4,5].map(i => ({ img: null, leg: 'Trabalho do studio 💅' }));
  $('#app').innerHTML = `
    <div class="perfil">
      <div class="avatar">${studio.logo ? `<img src="${studio.logo}">` : '💅'}</div>
      <div>
        <h1>${studio.nome}</h1>
        <div class="bio">${studio.bio || ''}</div>
        <div class="stats"><span><b>${fotos.length}</b> trabalhos</span><span><b>⭐</b> Clube Dymani</span></div>
      </div>
    </div>
    ${ind
      ? `<div class="pontos-banner">💖 Você veio pela <b>${ind}</b>! Agendando por aqui <b>vocês duas ganham pontos</b> no Clube Dymani — junte ${studio.meta} e a unha é grátis! 🎁</div>`
      : `<div class="pontos-banner">⭐ <b>Agendou, pontuou!</b> Cada visita vale ponto no Clube Dymani — junte ${studio.meta} e ganhe uma unha grátis 🎁</div>`}
    <a class="btn zap" href="#agendar" onclick="document.getElementById('agendar').scrollIntoView({behavior:'smooth'});return false">📅 Agendar agora</a>
    <button class="btn gold" onclick="divulgar()">⭐ Divulgar e ganhar pontos</button>

    <h2>Trabalhos 📸</h2>
    <div class="grid">
      ${fotos.map((f,i) => `<img src="${fotoSrc(f,i)}" alt="" onclick="abrirFoto(${i})">`).join('')}
    </div>

    <h2>Serviços 💅</h2>
    ${(studio.servicos || []).map(s => `
      <div class="servico"><span>${s.nome}</span><span class="preco">R$ ${s.preco}</span></div>`).join('')}

    <h2 id="agendar">Agendar horário 🗓️</h2>
    <div class="card">
      <b style="font-size:.9rem">1. Escolha o serviço</b>
      <div class="chips" id="c-serv">
        ${(studio.servicos || []).map((s,i) => `<div class="chip" onclick="escolherServ(${i},this)">${s.nome}</div>`).join('')}
      </div>
      <b style="font-size:.9rem">2. Escolha o dia</b>
      <div class="chips" id="c-dias">${diasHTML()}</div>
      <b style="font-size:.9rem">3. Escolha o horário</b>
      <div class="chips" id="c-horas"><span style="color:var(--muted);font-size:.85rem">Escolha um dia primeiro 😊</span></div>
      <button class="btn" onclick="abrirConfirmacao()">✨ Agendar e ganhar meu ponto</button>
    </div>

    <footer>💅 ${studio.nome}<br>
      <img src="dymani.jpg" alt="Dymani" style="width:130px;border-radius:12px;margin:10px 0 4px" onerror="this.style.display='none'"><br>
      Tecnologia · Conexão · Resultados</footer>`;
  window._fotos = fotos;
}

function diasHTML(){
  let html = '';
  for (let i = 0; i < 10; i++) {
    const d = new Date(Date.now() + i * 864e5);
    if (!studio.horarios || !studio.horarios[d.getDay()]) continue;
    const iso = new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0,10);
    html += `<div class="chip" data-iso="${iso}" data-dow="${d.getDay()}" onclick="escolherDia(this)">
      ${i === 0 ? 'Hoje' : i === 1 ? 'Amanhã' : DIAS[d.getDay()]}<span class="sub">${d.getDate()}/${d.getMonth()+1}</span></div>`;
  }
  return html || '<span style="color:var(--muted)">Consulte os horários no WhatsApp 😊</span>';
}
function escolherServ(i, el){
  sel.servico = i;
  el.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
  el.classList.add('on');
}
async function escolherDia(el){
  sel.dia = el.dataset.iso;
  sel.hora = null;
  el.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
  el.classList.add('on');
  $('#c-horas').innerHTML = '<span style="color:var(--muted);font-size:.85rem">Vendo horários livres… 👀</span>';
  let ocupados = [];
  try { ocupados = await rpc('cu_ocupados', { p_slug: slug, p_dia: sel.dia }); } catch(e) {}
  const horas = (studio.horarios && studio.horarios[el.dataset.dow]) || [];
  $('#c-horas').innerHTML = horas.map(h => {
    const ocup = ocupados.includes(h);
    return `<div class="chip ${ocup ? 'ocupado' : ''}" onclick="escolherHora('${h}',this)">${h}${ocup ? '<span class="sub">ocupado</span>' : ''}</div>`;
  }).join('') || '<span style="color:var(--muted)">Sem horários nesse dia 😕</span>';
}
function escolherHora(h, el){
  sel.hora = h;
  el.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
  el.classList.add('on');
}

/* ---------- confirmação ---------- */
function abrirConfirmacao(){
  if (sel.servico === null || !sel.dia || !sel.hora) { toast('Escolha serviço, dia e horário 😊'); return; }
  const s = studio.servicos[sel.servico];
  const [a,m,d] = sel.dia.split('-');
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `
    <div class="modal">
      <h2 style="margin:0">Quase lá! 💅</h2>
      <p style="color:var(--muted);font-size:.88rem;margin-top:4px">${s.nome} · ${d}/${m} às ${sel.hora}</p>
      <label>Seu nome *</label>
      <input id="m-nome" placeholder="Como você se chama?">
      <label>Seu WhatsApp *</label>
      <input id="m-zap" inputmode="numeric" placeholder="Com DDD, ex: 83988887777">
      <button class="btn" onclick="confirmarAgendamento(this)">🎉 Confirmar agendamento</button>
      <button class="btn ghost" onclick="this.closest('.modal-bg').remove()">Voltar</button>
    </div>`;
  bg.onclick = e => { if (e.target === bg) bg.remove(); };
  document.body.appendChild(bg);
}
async function confirmarAgendamento(btn){
  const nome = $('#m-nome').value.trim();
  const zap = ($('#m-zap').value || '').replace(/\D/g, '');
  if (nome.length < 2 || zap.length < 10) { toast('Preencha seu nome e WhatsApp 😊'); return; }
  btn.disabled = true; btn.textContent = 'Agendando… ✨';
  const s = studio.servicos[sel.servico];
  let res = 'erro';
  try {
    res = await rpc('cu_agendar', {
      p_slug: slug, p_servico: s.nome, p_dia: sel.dia, p_hora: sel.hora,
      p_nome: nome, p_zap: zap.startsWith('55') ? zap : '55' + zap, p_indicou: ind
    });
  } catch(e) {}
  if (res === 'ok') { telaSucesso(nome, s); return; }
  btn.disabled = false; btn.textContent = '🎉 Confirmar agendamento';
  if (res === 'ocupado') {
    toast('Ih, esse horário acabou de ser pego! Escolha outro 🥺');
    document.querySelector('.modal-bg').remove();
    const diaEl = document.querySelector('#c-dias .chip.on');
    if (diaEl) escolherDia(diaEl);
  } else {
    toast('Falha na conexão — tenta de novo 😊');
  }
}
function telaSucesso(nome, s){
  const [a,m,d] = sel.dia.split('-');
  const bg = document.querySelector('.modal-bg');
  bg.innerHTML = `
    <div class="modal sucesso">
      <div class="emoji">🎉</div>
      <h2>Agendado, ${nome.split(' ')[0]}!</h2>
      <p><b>${s.nome}</b><br>${d}/${m} às ${sel.hora}</p>
      <p class="destaque">⭐ +1 ponto no Clube Dymani!<br>Junte ${studio.meta} e sua unha é grátis 🎁</p>
      ${ind ? `<p>💖 A ${ind} também pontuou por te indicar!</p>` : ''}
      <a class="btn zap" href="https://wa.me/${studio.zap}?text=${encodeURIComponent(`Oi! Acabei de agendar pelo site 🎉\n✨ ${s.nome}\n🗓️ ${d}/${m} às ${sel.hora}\n— ${nome}${ind ? ' (vim pela ' + ind + ' 💖)' : ''}`)}">💬 Avisar no WhatsApp</a>
      <button class="btn gold" onclick="this.closest('.modal-bg').remove(); divulgar()">⭐ Divulgar e ganhar mais pontos</button>
      <button class="btn ghost" onclick="this.closest('.modal-bg').remove()">Fechar</button>
    </div>`;
  confete();
}

/* ---------- confete 🎊 ---------- */
function confete(){
  const cv = $('#confete'), x = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  const cores = ['#ec4899','#7c3aed','#fbbf24','#22c55e','#f472b6','#fff'];
  const pecas = Array.from({length: 160}, () => ({
    x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .5,
    w: 8 + Math.random() * 8, h: 6 + Math.random() * 6,
    cor: cores[Math.floor(Math.random() * cores.length)],
    vy: 2.5 + Math.random() * 3.5, vx: -1.5 + Math.random() * 3,
    rot: Math.random() * 6.3, vr: -.15 + Math.random() * .3
  }));
  let quadros = 0;
  (function anima(){
    x.clearRect(0, 0, cv.width, cv.height);
    pecas.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      x.save(); x.translate(p.x, p.y); x.rotate(p.rot);
      x.fillStyle = p.cor; x.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      x.restore();
    });
    if (++quadros < 240) requestAnimationFrame(anima);
    else x.clearRect(0, 0, cv.width, cv.height);
  })();
}

/* ---------- lightbox ---------- */
function abrirFoto(i){
  const f = window._fotos[i];
  const bg = document.createElement('div');
  bg.className = 'lightbox';
  bg.innerHTML = `
    <button class="fechar" onclick="this.parentElement.remove()">✕</button>
    <img src="${fotoSrc(f,i)}">
    <div class="leg">${f.leg || ''}</div>
    <button class="btn" style="max-width:480px" onclick="this.closest('.lightbox').remove(); document.getElementById('agendar').scrollIntoView({behavior:'smooth'})">💅 Quero igual — agendar</button>`;
  bg.onclick = e => { if (e.target === bg) bg.remove(); };
  document.body.appendChild(bg);
}

/* ---------- divulgação (link de pontos da cliente) ---------- */
async function divulgar(){
  const nome = prompt('Seu nome (pra você ganhar os pontos das amigas que agendarem):');
  if (!nome) return;
  const url = location.origin + location.pathname + '?s=' + encodeURIComponent(slug) + '&ind=' + encodeURIComponent(nome.trim());
  const texto = `💅 Gente, olha os trabalhos de ${studio.nome}! Amei o meu 😍\nAgenda pelo meu link que a gente ganha pontos e unha grátis: ${url}`;
  try { if (navigator.share) { await navigator.share({ text: texto }); return; } } catch(e) {}
  try { await navigator.clipboard.writeText(texto); toast('Copiado! Cola no seu status 💖'); }
  catch(e) { prompt('Copie o texto:', texto); }
}

carregar();
</script>
</div>
</body>
</html>
